image: weimens/texlive

stages:
  - build-pdf
  - post-build
  - build-zip
  - release

.latexmk-template: &latexmk-template
  stage: build-pdf
  script:
    - latexmk -$COMPILER -output-directory=build -jobname=%A-$CI_JOB_NAME $FILENAME.tex
    - tree .
  artifacts:
    paths:
      - build/*.pdf
    expire_in: 10 min

pdflatex-slides:
  <<: *latexmk-template
  variables: 
    FILENAME: "slides"
    COMPILER: "pdf"

xelatex-slides:
  <<: *latexmk-template
  variables: 
    FILENAME: "slides"
    COMPILER: "pdfxe"

luatex-slides:
  <<: *latexmk-template
  variables: 
    FILENAME: "slides"
    COMPILER: "pdflua"


pdflatex-letter:
  <<: *latexmk-template
  variables: 
    FILENAME: "letter"
    COMPILER: "pdf"

xelatex-letter:
  <<: *latexmk-template
  variables: 
    FILENAME: "letter"
    COMPILER: "pdfxe"

luatex-letter:
  <<: *latexmk-template
  variables: 
    FILENAME: "letter"
    COMPILER: "pdflua"


pdflatex-poster:
  <<: *latexmk-template
  variables: 
    FILENAME: "poster"
    COMPILER: "pdf"

xelatex-poster:
  <<: *latexmk-template
  variables: 
    FILENAME: "poster"
    COMPILER: "pdfxe"

luatex-poster:
  <<: *latexmk-template
  variables: 
    FILENAME: "poster"
    COMPILER: "pdflua"

consolidate-pdf-files:
  stage: post-build
  script:
    - du -sch .
  artifacts:
    name: "$CI_COMMIT_SHA"
    paths:
      - build/*.pdf
    expire_in: 1 week

# Installing zip in the weimens/texlive docker image,
# create artefact of quarto extension which can be
# used by users not cloning our repository.
zip_extension:
  stage: build-zip
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
    - apk add --no-cache cmake make g++
  script:
    - zip -r quarto-uibk-beamer.zip _extensions
  artifacts:
    paths:
      - quarto-uibk-beamer.zip
  only:
    - main

